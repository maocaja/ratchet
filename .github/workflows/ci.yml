name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ratchet
          POSTGRES_PASSWORD: ratchet
          POSTGRES_DB: ratchet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ratchet"
          --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://ratchet:ratchet@localhost:5432/ratchet
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync deps
        run: uv sync --all-extras
      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Import-linter (G2 — gate/orchestrator sin LLM)
        run: uv run lint-imports
      - name: Pytest (unit + PBT)
        run: uv run pytest tests/unit -q
      - name: Pytest (integración + e2e NIIF hermético, sin ANTHROPIC_API_KEY)
        run: uv run pytest tests/integration tests/e2e -q

[project]
name = "ratchet"
version = "0.1.0"
description = "El SRE de guardia del conocimiento de un RAG: mide, localiza, arregla y re-evalúa — mejora o revierte, nunca empeora."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
    "anthropic>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "import-linter>=2.0",
]

[project.scripts]
ratchet = "ratchet.api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".agents"]   # skills OpenSymphony vendored (third-party)

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# ─────────────────────────────────────────────────────────────────────────────
# Guardrail G2 (fail-closed desde CG-0): el gate y el orquestador NO pueden
# depender de ningún cliente LLM. "El razonamiento propone, la matemática dispone":
# toda agencia LLM vive río arriba (investigator/, y en U2+ experimenter/).
# El build de CI falla si alguien lo viola — protegido desde el commit 1.
# ─────────────────────────────────────────────────────────────────────────────
[tool.importlinter]
root_package = "ratchet"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "G2 — gate y orchestrator no dependen de ningún cliente LLM"
type = "forbidden"
source_modules = [
    "ratchet.gate",
    "ratchet.orchestrator",
]
forbidden_modules = [
    "ratchet.adapter.llm",
    "anthropic",
]
